[workspace]
# Only crates that actually contain a Cargo.toml belong here; Cargo fails to load
# the whole workspace if a member directory has no manifest. Re-add the entries
# below as each crate is scaffolded.
#
# Planned, not yet scaffolded:
#   apps/stream, apps/ai/orchestrator, apps/ai/memory,
#   packages/optics, packages/database, packages/event-sdk, packages/core
#
# apps/identity is not a Rust crate at all - it is the Ory Kratos/Keto
# deployment (compose.yaml + helm + config).
members = [
    "apps/gateway",
    "apps/ai/inference"
]
resolver = "2"