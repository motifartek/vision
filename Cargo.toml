[workspace]
resolver = "2"

# Yalnızca gerçekten Cargo.toml içeren dizinler burada listelenir; eksik bir
# manifest tüm workspace'in yüklenmesini engelliyor. Bir crate oluşturulduğunda
# buraya eklenmeli.
#
# Henüz oluşturulmamış: apps/ai/orchestrator, apps/ai/memory (#7),
# packages/database (#2).
#
# apps/identity bir Rust crate'i değil: Ory Kratos/Keto dağıtımı
# (compose.yaml + helm + config).
members = [
    "apps/gateway",
    "apps/ai/sonic",
    "apps/ai/vision",
    "apps/ai/orchestrator",
    "apps/stream",
    "packages/core",
    "packages/observer",
    "packages/database",
    "packages/event-sdk",
    "packages/optics",
    "tools/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/motifartek/vision"

[workspace.dependencies]
# Ortak sürümler tek yerden yönetilir; crate'ler `foo.workspace = true` ile alır.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Dahili crate'ler
motif-core = { path = "packages/core" }
motif-observer = { path = "packages/observer" }
motif-database = { path = "packages/database" }
motif-event-sdk = { path = "packages/event-sdk" }
motif-optics = { path = "packages/optics" }

# Servis katmanı. Gateway kendi axum 0.7 sürümünü ayrıca pinliyor; burada yeni
# kod için 0.8 kullanılıyor (yol parametresi sözdizimi {id} olarak değişti).
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.7", features = ["trace", "cors", "limit", "fs"] }
tower = "0.5"
async-nats = "0.50"
futures = "0.3"
mime_guess = "2.0"
