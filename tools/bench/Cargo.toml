[package]
name = "motif-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Olcum harness: event coverage recall, kare azaltma orani, islem suresi"
publish = false

[dependencies]
# Prompt ölçümü ajanın tamamını koşuyor; HTTP üzerinden ölçmek varyant seçimi
# için servise durum taşımayı gerektirirdi.
vision = { path = "../../apps/ai/vision" }
motif-prompt.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio.workspace = true
serde.workspace = true

motif-core.workspace = true
motif-event-sdk.workspace = true
motif-optics.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true

[[bin]]
name = "bench"
path = "src/main.rs"
