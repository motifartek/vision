global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['host.docker.internal:8889']

  - job_name: gateway
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics

  - job_name: stream
    static_configs:
      - targets: ['host.docker.internal:8100']
    metrics_path: /metrics

  - job_name: inference
    static_configs:
      - targets: ['host.docker.internal:8081']
    metrics_path: /metrics
