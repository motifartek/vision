# Postgres — prompt override deposu.
#
# İsteğe bağlı: servis DATABASE_URL yoksa ya da veritabanına ulaşamazsa
# gömülü katalogla çalışmaya devam eder.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      # 5433: makinede yerel bir Postgres kuruluysa 5432'yi o tutuyor ve
      # konteynerin önüne geçiyor. Ölçümde tam olarak bu oldu.
      - "5433:5432"
    environment:
      - POSTGRES_USER=motif
      - POSTGRES_PASSWORD=motif
      - POSTGRES_DB=motif
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motif"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pg-data:
