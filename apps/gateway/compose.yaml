services:
  gateway:
    build:
      context: ../../
      dockerfile: Dockerfile
      target: gateway
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_KRATOS_URL=http://kratos:4433
      - GATEWAY_KETO_URL=http://keto:4466
      - GATEWAY_INFERENCE_URL=http://sonic:8081
      - GATEWAY_STREAM_URL=http://stream:8100
      - TOOLBOX_URL=http://toolbox:8116
      - DATABASE_URL=postgres://motif:motif@postgres:5432/motif
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=gateway
    depends_on:
      - kratos
      - keto
      - postgres
    restart: unless-stopped
    networks:
      - default
      - observability
