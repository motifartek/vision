services:
  gateway:
    build:
      context: ../../
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_KRATOS_URL=http://kratos:4433
      - GATEWAY_KETO_URL=http://keto:4466
      - GATEWAY_INFERENCE_URL=http://host.docker.internal:8081
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=gateway
    depends_on:
      - kratos
      - keto
    restart: unless-stopped
    networks:
      - default
      - observability
