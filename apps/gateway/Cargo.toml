[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
motif-observer.workspace = true
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# HTTP İstemci (Ory Kratos için)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Metrikler için
axum-prometheus = "0.7"

# gRPC (Ory Keto için)
tonic = "0.12"
prost = "0.13"

# Cache (Kratos session için)
moka = { version = "0.12", features = ["future"] }

# Serileştirme ve Hata Yönetimi
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1.1"
sqlx.workspace = true
tokio-stream = { version = "0.1.19", features = ["sync"] }
async-stream = "0.3.6"

[build-dependencies]
tonic-build = "0.12"
# protoc'u sisteme kurdurmamak icin ikili paketle geliyor: depoyu klonlayan
# herkes `cargo build` diyebilsin.
protoc-bin-vendored = "3"


