services:
  sonic:
    build:
      context: ../../../
      dockerfile: apps/ai/sonic/Dockerfile
    image: docker-sonic
    ports:
      - "8081:8081"
    environment:
      - SONIC_PORT=8081
      - SONIC_MODELS_DIR=/app/models
      # Kok, `stream`in depo koku olmali: orchestrator sonic'e nesne
      # anahtarini (`raw/<id>.mp4`) veriyor ve bu anahtar oraya gore cozuluyor.
      # Onceden panelin public/media dizinine bakiyordu; stream'e yuklenen
      # videolarin hicbirini goremiyordu.
      - SONIC_MEDIA_ROOT=/media
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      # Model agirliklari (~410 MB). Depoda tutulmuyor; once host'a indiriliyor:
      #   sh apps/ai/sonic/scripts/fetch-models.sh ced-base
      #
      # Isimli volume degil bind mount: script zaten bu dizine indiriyor ve
      # isimli volume'u dolduran bir adim yoktu, o yuzden sonic bos /app/models
      # ile acilip yeniden baslatma dongusune giriyordu. Bind mount ayrica
      # `docker compose down -v` sonrasi 410 MB'i tekrar indirtmiyor.
      - ./models:/app/models:ro
      # `stream`in yazdigi ham videolar. Salt okunur: sonic yalnizca okur.
      - ../../../data/stream:/media:ro
    restart: unless-stopped
    networks:
      - default
      - observability

