services:
  sonic:
    build:
      context: ../../../
      # Kök Dockerfile, `sonic` hedefi — diğer altı servisle aynı desen.
      #
      # `apps/ai/sonic/Dockerfile` aa192d0 ile silinip kök dosyaya taşınmıştı
      # ama bu satır güncellenmemişti. Hata görünmüyordu çünkü imaj zaten
      # derlenmiş duruyordu; sıfırdan derlemede ortaya çıktı.
      dockerfile: Dockerfile
      target: sonic
    image: docker-sonic
    ports:
      - "8081:8081"
    environment:
      - SONIC_PORT=8081
      - SONIC_MODELS_DIR=/app/models
      # Kok, `stream`in depo koku olmali: orchestrator sonic'e nesne
      # anahtarini (`raw/<id>.mp4`) veriyor ve bu anahtar oraya gore cozuluyor.
      # Onceden panelin public/media dizinine bakiyordu; stream'e yuklenen
      # videolarin hicbirini goremiyordu.
      - SONIC_MEDIA_ROOT=/media
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      # Modellerin saklandigi yer
      - ./models:/app/models:ro
      # `stream`in yazdigi ham videolar. Salt okunur: sonic yalnizca okur.
      - ../../../data/stream:/media:ro
    restart: unless-stopped
    networks:
      - default
      - observability


