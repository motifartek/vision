services:
  humanizer:
    build:
      context: ../../../
      dockerfile: Dockerfile
      target: humanizer
    ports:
      - "8115:8115"
    environment:
      - HUMANIZER_BIND=0.0.0.0:8115
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgres://motif:motif@postgres:5432/motif
      # Anahtar depoda tutulmaz; kabuktan aktarılır.
      - EVREN_KEY=${EVREN_KEY:?EVREN_KEY tanımlı değil}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=humanizer
    depends_on:
      - nats
      - postgres
    restart: unless-stopped
    networks:
      - default
      - observability
