services:
  orchestrator:
    build:
      context: ../../../
      dockerfile: apps/ai/orchestrator/Dockerfile
    image: docker-orchestrator
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgres://root:root@postgres:5432/motif
      - SONIC_URL=http://sonic:8081
      - VISION_URL=http://vision:8110
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=orchestrator
    depends_on:
      - nats
      - postgres
    restart: unless-stopped
    networks:
      - default
      - observability