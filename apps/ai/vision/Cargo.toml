[package]
name = "vision"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Video analiz ajanı: klip ister, VLM'e sorar, şartname raporunu üretir"

[lib]
name = "vision"
path = "src/lib.rs"

[[bin]]
name = "vision"
path = "src/main.rs"

[dependencies]
motif-core.workspace = true
motif-event-sdk.workspace = true
# Servis sınırları (520 kare / 2 fps / 260 sn) tek yerde dursun diye:
# uzun kayıt parçalaması bu sabitlere dayanıyor.
motif-optics.workspace = true
motif-observer.workspace = true
motif-prompt.workspace = true
motif-database.workspace = true

axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true

async-trait = "0.1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
