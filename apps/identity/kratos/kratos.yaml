version: v1.1.0

dsn: memory # overridden by DSN env var in docker-compose

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: true
  admin:
    base_url: http://127.0.0.1:4434/

selfservice:
  # Dashboard Next.js dev sunucusu 3001'de çalışır (3000 Kratos'a ayrıldı)
  default_browser_return_url: http://127.0.0.1:3001/
  allowed_return_urls:
    - http://127.0.0.1:3001

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        identifier_similarity_check_enabled: true

  flows:
    error:
      ui_url: http://127.0.0.1:3001/auth/error

    settings:
      ui_url: http://127.0.0.1:3001/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: http://127.0.0.1:3001/auth/recovery
      use: code

    verification:
      enabled: true
      ui_url: http://127.0.0.1:3001/auth/verify
      use: code
      after:
        default_browser_return_url: http://127.0.0.1:3001/

    logout:
      after:
        default_browser_return_url: http://127.0.0.1:3001/auth/login

    login:
      ui_url: http://127.0.0.1:3001/auth/login
      lifespan: 10m

    registration:
      lifespan: 10m
      ui_url: http://127.0.0.1:3001/auth/register
      after:
        password:
          hooks:
            - hook: session
            - hook: show_verification_ui

log:
  level: debug
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  argon2:
    parallelism: 1
    memory: 128MB
    iterations: 2
    salt_length: 16
    key_length: 16

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
